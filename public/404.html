<!doctype html>

<html lang="en">

  <head>

    <title>Page not found · Campsend</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #f5f5f5;
        color: #171717;
        display: grid;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 1rem;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
      }

      main {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
        display: grid;
        gap: 1.25rem;
        max-width: 26rem;
        padding: 2.5rem;
        place-items: center;
        text-align: center;
        width: calc(100% - 2rem);
      }

      .wordmark {
        align-items: center;
        color: #171717;
        display: inline-flex;
        font-size: 1.25rem;
        font-weight: 600;
        gap: 0.5rem;
        text-decoration: none;
      }

      .wordmark-icon {
        background: #ff591e;
        border-radius: 8px;
        color: #ffffff;
        display: inline-grid;
        font-size: 0.875rem;
        font-weight: 700;
        height: 2rem;
        place-items: center;
        width: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.2;
      }

      p {
        color: #525252;
        font-size: 0.9375rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      a {
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.65rem 1.1rem;
        text-decoration: none;
      }

      .button--primary {
        background: #ff591e;
        color: #ffffff;
      }

      .button--quiet {
        color: #525252;
      }

    </style>

  </head>

  <body>

    <main>
      <a href="/" class="wordmark">
        <span class="wordmark-icon" aria-hidden="true">C</span>
        <span>Campsend</span>
      </a>

      <h1>Page not found</h1>

      <p>The address may be wrong, or the page may have moved. If you think something is broken, let us know.</p>

      <div class="actions">
        <a href="/" class="button--primary">Go home</a>
        <a href="mailto:obakeng@campsend.app" class="button--quiet">Contact support</a>
      </div>
    </main>

  </body>

</html>
